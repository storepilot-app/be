spring:
  application:
    name: be
  datasource:
    url: ${DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 150MB

storepilot:
  upload-dir: uploads
  auth:
    jwt-secret: ${STOREPILOT_AUTH_JWT_SECRET}
    access-token-minutes: ${STOREPILOT_AUTH_ACCESS_TOKEN_MINUTES}
    refresh-token-days: ${STOREPILOT_AUTH_REFRESH_TOKEN_DAYS}
    cookie-secure: ${STOREPILOT_AUTH_COOKIE_SECURE}
    cookie-same-site: ${STOREPILOT_AUTH_COOKIE_SAME_SITE}
    allowed-origins: ${STOREPILOT_AUTH_ALLOWED_ORIGINS}
    app-base-url: ${STOREPILOT_APP_BASE_URL:http://localhost:3000}
    email-verification:
      enabled: ${STOREPILOT_EMAIL_VERIFICATION_ENABLED:false}
      token-minutes: ${STOREPILOT_EMAIL_VERIFICATION_TOKEN_MINUTES:30}
  mail:
    resend:
      api-key: ${STOREPILOT_RESEND_API_KEY}
      from: ${STOREPILOT_MAIL_FROM:StorePilot <onboarding@resend.dev>}
  ai:
    base-url: ${AI_SERVER_BASE_URL}
  category:
    batch-size: 300

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
