spring:
  application:
    name: be
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

storepilot:
  upload-dir: uploads

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
